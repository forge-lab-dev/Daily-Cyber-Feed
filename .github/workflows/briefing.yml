name: Power and AI cyber briefing

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "morning"
        type: choice
        options:
          - morning
          - update
  schedule:
    - cron: "0 8 * * *"
      timezone: "America/Denver"
    - cron: "0 9 * * *"
      timezone: "America/Denver"

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run briefing
        run: python briefing.py
        env:
          BRIEFING_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || (github.event.schedule == '0 9 * * *' && 'update' || 'morning') }}
          ASSET_KEYWORDS: ${{ vars.PRIORITY_KEYWORDS }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}








